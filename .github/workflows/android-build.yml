name: Android APK

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Executar testes e gerar APK debug
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug

      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: Lumivox-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-release-apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restaurar chave de assinatura
        env:
          LUMIVOX_KEYSTORE_BASE64: ${{ secrets.LUMIVOX_KEYSTORE_BASE64 }}
        run: |
          test -n "$LUMIVOX_KEYSTORE_BASE64"
          echo "$LUMIVOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumivox-release.jks"

      - name: Testar e gerar APK release assinado
        env:
          LUMIVOX_KEYSTORE_PATH: ${{ runner.temp }}/lumivox-release.jks
          LUMIVOX_STORE_PASSWORD: ${{ secrets.LUMIVOX_STORE_PASSWORD }}
          LUMIVOX_KEY_ALIAS: ${{ secrets.LUMIVOX_KEY_ALIAS }}
          LUMIVOX_KEY_PASSWORD: ${{ secrets.LUMIVOX_KEY_PASSWORD }}
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:assembleRelease

      - name: Publicar APK release
        uses: actions/upload-artifact@v4
        with:
          name: Lumivox-Android-release-assinado
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
